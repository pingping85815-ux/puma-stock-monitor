name: PUMA stock monitor

on:
  schedule:
    # Offset from common five-minute boundaries to reduce GitHub scheduler congestion.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send an SMTP test email before checking stock"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: puma-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCT_URL: ${{ vars.PRODUCT_URL || 'https://uk.puma.com/uk/en/pd/scuderia-ferrari-replica-singapore-charles-leclerc-baseball-cap/027498?size=0150' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_SSL: ${{ secrets.SMTP_SSL || 'true' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Restore previous stock state
        id: previous
        run: |
          if git fetch --quiet --no-tags origin state && \
             state="$(git show FETCH_HEAD:stock-state.txt 2>/dev/null)"; then
            case "$state" in
              InStock|OutOfStock) ;;
              *) state="" ;;
            esac
          else
            state=""
          fi
          echo "stock_state=$state" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        run: python3 monitor.py --test-email

      - name: Check PUMA stock
        id: monitor
        env:
          PREVIOUS_STOCK_STATE: ${{ steps.previous.outputs.stock_state }}
        run: python3 monitor.py --github-actions

      - name: Persist stock state
        if: ${{ steps.previous.outputs.stock_state != steps.monitor.outputs.stock_state }}
        env:
          STOCK_STATE: ${{ steps.monitor.outputs.stock_state }}
        run: |
          case "$STOCK_STATE" in
            InStock|OutOfStock) ;;
            *) echo "Refusing to persist invalid state" >&2; exit 1 ;;
          esac

          printf '%s\n' "$STOCK_STATE" > stock-state.txt
          blob="$(git hash-object -w stock-state.txt)"
          tree="$(printf '100644 blob %s\tstock-state.txt\n' "$blob" | git mktree)"
          commit="$(printf 'Update PUMA stock state to %s\n' "$STOCK_STATE" | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree")"

          for attempt in 1 2 3; do
            if git push --force origin "${commit}:refs/heads/state"; then
              exit 0
            fi
            echo "State push attempt $attempt failed; retrying shortly" >&2
            sleep $((attempt * 3))
          done
          echo "Failed to persist stock state after 3 attempts" >&2
          exit 1
